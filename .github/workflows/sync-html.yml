name: sync bundled frontend

on:
  push:
    paths:
    - ".github/workflows/sync-html.yml"
    - "html/**"
    - "test/font-check.js"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Build the embedded frontend
        run: |
          corepack enable
          yarn install --immutable
          yarn run check
          yarn run build
        working-directory: html
      - name: Commit the regenerated header
        run: |
          if git diff --quiet -- src/html.h; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/html.h
          git commit -m 'build: regenerate bundled frontend'
          git push
